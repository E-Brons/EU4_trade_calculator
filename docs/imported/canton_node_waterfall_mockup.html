<h2 class="sr-only">Bar chart breaking down Canton node value into local, incoming, total, and the collect vs steer outcome</h2>
<div style="position:relative;width:100%;height:280px;">
<canvas id="wf" role="img" aria-label="Local value 8, incoming value 14, total value 22, collect outcome 8.4 ducats, steer outcome 0 ducats deferred">Local 8, incoming 14, total 22, collect 8.4, steer 0</canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
new Chart(document.getElementById('wf'), {
  type: 'bar',
  data: {
    labels: ['Local value','Incoming value','Total value','Collect: your ducats','Steer: ducats here'],
    datasets: [{
      data: [8, 14, 22, 8.4, 0],
      backgroundColor: ['#7F77DD','#AFA9EC','#534AB7','#1D9E75','#B4B2A9']
    }]
  },
  options: {
    responsive: true, maintainAspectRatio: false,
    plugins: { legend: { display: false } },
    scales: { x: { ticks: { autoSkip:false, maxRotation:30 } }, y: { title: { display:true, text:'ducats' } } }
  }
});
</script>
