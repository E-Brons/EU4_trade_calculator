name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast unit/integration tests -- everything except the real-save corpus,
  # so a syntax/logic error fails in seconds instead of waiting on the
  # much slower save-verification job below.
  backend-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q --ignore=tests/test_real_saves.py --ignore=tests/trade

  # LEGACY, removed at cutover: this runs the old engine's replay shortcut, which reads the save's own numbers back, so it
  # does NOT prove the formula (see docs/trade_testing.md). The real check is verify-trade-calculation below.
  # The raw .eu4 saves are gitignored (multi-GB); each has a small tracked zip under tests/fixtures/saves_zip/,
  # unzipped lazily into a pytest tmp_path per test.
  verify-calculation-vs-saves:
    name: "Legacy replay check (to be removed at cutover)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Confirm the save corpus is actually present (not silently all-skipped)
        run: |
          python3 - <<'EOF'
          import json, zipfile
          from pathlib import Path
          manifest = json.loads(Path("tests/fixtures/saves/saves.json").read_text())["saves"]
          zip_dir = Path("tests/fixtures/saves_zip")
          missing = [e["id"] for e in manifest if not (zip_dir / f"{e['file']}.zip").exists()]
          if missing:
              raise SystemExit(f"{len(missing)}/{len(manifest)} fixture saves have no tracked zip: {missing}")
          print(f"{len(manifest)} fixture saves present, zips verified readable.")
          for e in manifest:
              with zipfile.ZipFile(zip_dir / f"{e['file']}.zip") as zf:
                  zf.testzip()
          EOF
      - run: python -m pytest -q tests/test_real_saves.py -v

  # THE trade-calculation check. One calculation file (backend/app/trade/calc.py) is run, stage by stage and end to end, over
  # EVERY fixture save (all countries, all nodes) and compared with what the game recorded. Stages whose rule is still
  # under research are listed as RED in backend/tests/trade/expected.py (strict xfail): they flip loudly when fixed, and
  # no green stage can silently regress. Also enforces: one calculation module, complete variable registry, edge-case
  # coverage, up-to-date docs/trade_spec.md, stored user cases (git LFS). Same command locally: scripts/verify_all.sh
  verify-trade-calculation:
    name: "Verify trade calculation (calc.py vs every fixture save)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true   # stored user cases (Uxx_*.eu4.zip) live in git LFS
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: bash scripts/verify_all.sh
        env:
          PYTHON: python
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-verification-report
          path: verify-out/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --pwa-strategy=none
